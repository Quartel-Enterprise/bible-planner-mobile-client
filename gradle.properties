# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
# iOS targets can't build or run tests on Linux/Windows (CI, desktop release builders); skip them silently there.
kotlin.native.ignoreDisabledTargets=true

# Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# commonTest runs on the JVM target (jvmTest); android host tests are only enabled for Roborazzi screenshot modules.
android.sync.suppressAgpWarnings=GENERIC,UNSUPPORTED_PROJECT_OPTION_USE
