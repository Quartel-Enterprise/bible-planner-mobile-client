name: 'Run ktlint'
description: 'Runs ktlint check and annotates results'

runs:
  using: "composite"
  steps:
    - name: Read ktlint and ruleset versions
      id: versions
      shell: bash
      run: |
        KTLINT=$(sed -nE 's/^ktlint[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -1)
        RULESET=$(sed -nE 's/^quare-ktlint-rules[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -1)
        echo "key=$KTLINT-$RULESET" >> "$GITHUB_OUTPUT"

    - name: Cache ktlint CLI and ruleset
      uses: actions/cache@v6
      with:
        path: ~/.cache/ktlint
        key: ktlint-${{ steps.versions.outputs.key }}

    - name: Run ktlint check (same as local)
      id: ktlint-check
      shell: bash
      run: |
        chmod +x ./scripts/ktlint.sh
        ./scripts/ktlint.sh
      continue-on-error: true

    - name: Annotate ktlint results
      uses: yutailang0119/action-ktlint@v6
      with:
        report-path: 'build/ktlint-report.xml'
        ignore-warnings: false
      continue-on-error: false

    - name: Fail if ktlint found errors
      shell: bash
      if: steps.ktlint-check.outcome == 'failure'
      run: |
        echo "❌ ktlint found formatting errors. Please run './scripts/ktlint.sh --format' to fix them."
        exit 1
