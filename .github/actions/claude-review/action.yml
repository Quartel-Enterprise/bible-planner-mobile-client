name: 'Claude review'
description: 'Reviews the pull request with the /code-review skill bundled with Claude Code, at high effort, optionally fixes the findings, and posts them as one review'

# The review step only reviews: the findings come back as JSON in Claude's last message. A Stop hook
# of the session (stop-hook.sh) then hands them to post-review.sh, which posts them as one pull
# request review. The hook runs inside the session, so the review is posted as claude[bot], with the
# Claude GitHub App's token the action gives the session and revokes when it ends: a step after the
# action couldn't use it. When the hook didn't post (no token, a GitHub outage), the posting step
# below posts the same findings with the workflow's token, as github-actions. The model posts nothing
# itself: the skill's --comment flag posts one review per finding, each with its own notification,
# and a script run by the model depends on a Bash allowlist the action didn't honour for it. The hook
# and the scripts it runs are copied out of the checkout first, into a read-only directory the
# session can't write: its Edit rule covers the checkout only, and none of the Bash commands it is
# allowed writes a file (see the claude step).
#
# With fix, the review also applies its findings to the working tree, and the hook commits them and
# pushes the commit to the pull request's branch (commit-fixes.sh) before it posts: the review then
# lists the fixed findings in its body, which opens no thread, and only the others as inline
# comments. A push with the App's token starts the pull request's workflows on the new commit, which
# a push with GITHUB_TOKEN wouldn't. The model may only edit files of the checkout, never under .git,
# .github, .claude or .agent-memory, and never create a file.

inputs:
  oauth-token:
    description: 'The CLAUDE_CODE_OAUTH_TOKEN secret.'
    required: true
  instructions:
    description: 'Extra instructions appended to the review prompt.'
    required: false
    default: ''
  memory-ssh-key:
    description: 'The AGENT_MEMORY_DEPLOY_KEY secret: a read-only deploy key of the private agent memory repository.'
    required: false
    default: ''
  fix:
    description: "'true' to apply the findings and push them as a commit to the pull request's branch."
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    # The agent memories live in a private repository, since this one is public. Only the feedback_*
    # ones, the conventions the maintainer asked for, reach the runner: the project_* ones and the
    # index hold figures and ids a comment must never repeat. Without the key, or when the checkout
    # fails, the review still runs, only without them.
    - id: memory
      if: inputs.memory-ssh-key != ''
      continue-on-error: true
      uses: actions/checkout@v6
      with:
        repository: PierreVieira/bible-planner-agent-memory
        ssh-key: ${{ inputs.memory-ssh-key }}
        path: .agent-memory
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: |
          feedback_*.md
        sparse-checkout-cone-mode: false

    # Excluded from the pull request's checkout, so the review's searches over the repository skip it.
    # The review's own recipe asks the model to quote the rule behind a conventions finding; for these
    # private conventions it is told to paraphrase instead.
    - id: memory-instructions
      shell: bash
      env:
        MEMORY_OUTCOME: ${{ steps.memory.outcome }}
      run: |
        if [ "$MEMORY_OUTCOME" != success ]; then
          echo "::warning::The agent memories weren't checked out, so the review runs without them."
          exit 0
        fi
        echo ".agent-memory/" >> .git/info/exclude
        {
          echo "text<<MEMORY_INSTRUCTIONS_END"
          echo "The maintainer's conventions for this repository are in .agent-memory/feedback_*.md,"
          echo "one per file: read them all and treat them with the same weight as CLAUDE.md."
          echo "They are private and this repository is public: cite a convention in your own words,"
          echo "never quote a file or name its path in a finding, even where the review's recipe"
          echo "asks you to quote the rule. .agent-memory is not part of the pull request: never"
          echo "review it."
          echo "MEMORY_INSTRUCTIONS_END"
        } >> "$GITHUB_OUTPUT"

    # The review can't read the earlier reviews on the pull request, so the findings they left (a
    # draft marked ready a second time, a review on request after new pushes) are handed to it, for it
    # not to raise the same issues again: the inline comments, and the bodies of the reviews that
    # listed findings GitHub couldn't anchor to a line.
    # The list is a help, not a condition: a GitHub error here only leaves it short. gh runs its --jq
    # filters with gojq, whose regexes (RE2) have no lookahead, so the numbered findings of a review
    # body are grouped paragraph by paragraph instead; only a paragraph in post-review.sh's own form
    # ("1. `path:line`" or "1. (no file)") starts a finding, a numbered list inside one doesn't, and
    # neither does one inside a code block (a suggestion), which may hold blank lines.
    - id: earlier
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        comments=$(
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == "claude[bot]")
              | "- \(.path):\(.line // .original_line): \(.body | gsub("\\s+"; " ") | .[0:300])"' \
            || echo "::warning::The earlier inline comments couldn't be read, so the review isn't told about them." >&2
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == "claude[bot]")
              | .body | select(test("^### Code review\\s+[0-9]+ finding"))
              | gsub("\\s*<!-- claude-review run [^>]*-->"; "")
              | split("\n\n")[1:]
              | reduce .[] as $paragraph ({items: [], fenced: false};
                  (if (.fenced | not) and ($paragraph | test("^[0-9]+\\. (`|\\(no file\\))")) then .items += [$paragraph]
                    elif (.items | length) > 0 then .items[-1] += " " + $paragraph else . end)
                  | .fenced = (.fenced != ([$paragraph | scan("(?m)^\\s*```")] | length % 2 == 1)))
              | .items[] | "- " + (gsub("\\s+"; " ") | .[0:300])' \
            || echo "::warning::The earlier review bodies couldn't be read, so the review isn't told about them." >&2
        )
        {
          echo "text<<EARLIER_COMMENTS_END"
          if [ -n "$comments" ]; then
            echo "Claude reviewed this pull request before and left these comments. Don't report an"
            echo "issue one of them already raised:"
            echo "$comments"
          fi
          echo "EARLIER_COMMENTS_END"
        } >> "$GITHUB_OUTPUT"

    # The hook and the scripts it runs live outside the checkout for the session, in a directory made
    # read-only, since the hook runs with the App's token. The session can't write there anyway (its
    # Edit rule covers the checkout only, and none of its Bash commands writes a file); the read-only
    # copy and the checks on the markers (stop-hook.sh) keep that true if a later change lets it. The
    # hook's markers go to a state directory of their own. When the review started, for the posting
    # step to tell a review the hook posted from one it didn't, and whether the hook commits the fixes
    # reach the hook as arguments rather than files. The Bash guard (bash-guard.sh) is the session's
    # PreToolUse hook, copied with them.
    - id: tools
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FIX: ${{ inputs.fix }}
      run: |
        dir="$RUNNER_TEMP/claude-review"
        state="$RUNNER_TEMP/claude-review-state"
        # A run before this one in the same job left its copy read-only, and its markers and logs.
        if [ -d "$dir" ]; then
          chmod -R u+w "$dir"
          rm -rf "$dir"
        fi
        rm -rf "$state"
        mkdir -p "$dir" "$state"
        cp .github/actions/claude-review/stop-hook.sh .github/actions/claude-review/post-review.sh \
          .github/actions/claude-review/extract-findings.py .github/actions/claude-review/commit-fixes.sh \
          .github/actions/claude-review/bash-guard.sh "$dir/"
        chmod -R a-w "$dir"
        # A symlink the pull request adds could point the session's Read allow rule for the checkout at
        # /proc, $RUNNER_TEMP or the checkout's .git, or its Edit allow rule at .github or .claude, if a
        # deny rule checks the link's path rather than its target. One that leaves the checkout or
        # enters one of those is removed for the review; commit-fixes.sh restores it before committing.
        # The checkout's own path is resolved first, in case the workspace sits behind a symlink.
        root=$(realpath "$PWD")
        while IFS= read -r -d '' link; do
          case "$(realpath -m "$link")" in
            "$root"/.git | "$root"/.git/* | "$root"/.github | "$root"/.github/*) ;;
            "$root"/.claude | "$root"/.claude/*) ;;
            "$root"/*) continue ;;
          esac
          rm -f "$link"
          # The path is the pull request's to pick: escaped, a newline in it can't start a workflow
          # command of its own.
          shown=${link//'%'/%25}
          shown=${shown//$'\r'/%0D}
          shown=${shown//$'\n'/%0A}
          echo "::notice::$shown points outside the checkout or into .git, .github or .claude, so the review doesn't see it."
        done < <(find . -path ./.git -prune -o -type l -print0)
        # With fix, the reviewed commit's version of each file the pull request changes, for the
        # suggestions: the working tree then holds the review's own changes, and git show, which would
        # read the commit, isn't allowed (see the claude step). Without fix, the checkout is that
        # commit. The copy is cleared first, since it lives outside $RUNNER_TEMP (which the session
        # can't read: checkout keeps its credentials there) and a reused runner would keep the last
        # one. The files come from the API, which lists up to 3,000 of them whatever the diff's size; a
        # file the pull request deletes has no version to copy, and without the list suggestions are
        # only left out.
        reviewed="$PWD"
        if [ "$FIX" = true ]; then
          reviewed="$(dirname "$RUNNER_TEMP")/reviewed-head"
          rm -rf "$reviewed"
          mkdir -p "$reviewed"
          if files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | if .status == "removed" then "" else .filename end'); then
            if [ "$(wc -l <<< "$files")" -ge 3000 ]; then
              echo "::warning::The pull request changes 3,000 files or more, so the copy of the reviewed commit may miss some."
            fi
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              mkdir -p "$reviewed/$(dirname "$file")"
              git show "HEAD:$file" > "$reviewed/$file" 2> /dev/null || rm -f "$reviewed/$file"
            done <<< "$files"
          else
            echo "::warning::The pull request's files couldn't be listed, so the review has no copy of the reviewed commit."
          fi
        fi
        {
          echo "dir=$dir"
          echo "state=$state"
          echo "reviewed=$reviewed"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$GITHUB_OUTPUT"

    # What changes with fix: the skill's --fix flag, the task, the outcome of each finding, and the
    # model's file tools: Edit is allowed inside the checkout only (and in --tools), never under .git,
    # .github, .claude (settings and hooks the session could pick up) or .agent-memory; Write stays
    # denied, since the commit only takes files the branch already tracks. Edit rules cover every tool
    # that edits a file; the deny rules win over the allow rule.
    - id: mode
      shell: bash
      env:
        FIX: ${{ inputs.fix }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        if [ "$FIX" = true ]; then
          {
            echo "arguments=high $PR_NUMBER --fix --max-findings all"
            echo "tools=Task,Bash,Read,Edit,Grep,Glob,Skill"
            echo "allowed=,Edit(/$WORKSPACE/**)"
            echo "denied=Write,NotebookEdit,Edit(/$WORKSPACE/.git/**),Edit(/$WORKSPACE/.github/**),Edit(/$WORKSPACE/.claude/**),Edit(/$WORKSPACE/.agent-memory/**),"
            echo "task<<TASK_END"
            echo "and let it apply its findings to the working tree, which is the pull request's head"
            echo "commit. Apply a fix only when it is clear and stays within what the finding describes,"
            echo "editing files that already exist; leave a finding that needs the author's call (a design"
            echo "choice, a product behaviour, a fix that needs a new file) as it is. Never edit anything"
            echo "under .git, .github, .claude or .agent-memory, and don't commit or push: a later step"
            echo "commits the working tree to the pull request's branch."
            echo "TASK_END"
            echo "outcome<<OUTCOME_END"
            echo ', and "outcome": "fixed" when the working tree now holds its fix, "skipped" when it'
            echo 'was left for the author, or "no_change_needed" when a closer look showed nothing to change'
            echo "OUTCOME_END"
            echo "posting=A later step commits the fixes and posts that array as one pull request review."
            echo "editing=and don't invoke any other skill."
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "arguments=high $PR_NUMBER --max-findings all"
            echo "tools=Task,Bash,Read,Grep,Glob,Skill"
            echo "allowed="
            echo "denied=Write,Edit,NotebookEdit,"
            echo "task=and wait for its findings."
            echo "outcome="
            echo "posting=A later step posts that array as one pull request review."
            echo "editing=don't invoke any other skill and don't edit any file."
          } >> "$GITHUB_OUTPUT"
        fi

    # The same review as the create-pr skill runs before the pull request opens, the /code-review
    # skill bundled with Claude Code at high effort, on Opus (see docs/ci.md, "AI review"). The model
    # invokes the skill itself, with the level, the pull request number, --max-findings and, with fix,
    # --fix as its only arguments: put on the skill's command line, the instructions below would become
    # part of its target. Without --max-findings all, the skill keeps only the ten most severe
    # findings, so a large pull request needed a review on request after every round of fixes to see
    # the rest (#585 took 27).
    #
    # The skill's findings carry no severity and no fix, so the model adds both after it returns: the
    # severity labels each comment, and a fix that only replaces the commented lines becomes a GitHub
    # suggestion the author can commit from the pull request (post-review.sh). The suggestion is read
    # from the reviewed commit, since with fix the working tree holds the review's own changes.
    #
    # Without a tool to report through, the skill returns its findings as a JSON array, which is what
    # the Stop hook (settings) and the posting step read from Claude's last message. The hook gets the
    # pull request number and the reviewed commits from the runner's environment, and has time for the
    # script's retries, so it isn't killed between a post and its marker.
    #
    # The session can only read through the Read, Grep and Glob tools, and only the checkout and the
    # reviewed commit's copy: a path no allow rule names is denied, since nobody is there to approve
    # it, and Read rules cover Grep and Glob too. The deny rules repeat it for what must never be
    # read: the runner's environment (/proc), $RUNNER_TEMP (checkout's credentials, the hook's state),
    # /etc, /tmp, the checkout's .git and the home's files that hold credentials. Claude Code's own
    # folder for the session (~/.claude/projects) stays readable: a Bash output too long to show,
    # such as a large gh pr diff, is saved there.
    #
    # A Bash command that reads or writes a file of its choosing would get around them: cat, grep,
    # jq, git diff --no-index and git blame --contents read any file, and git diff, log and show write
    # one with --output, which once let a prompt injection rewrite the Stop hook. So the only Bash
    # commands allowed are gh's read-only ones, which take the diff from GitHub (gh pr diff), and git
    # commands that print neither a file nor their arguments. The allowlist only matches a command's
    # start, and Claude Code runs some read-only commands without asking, so the Bash guard
    # (bash-guard.sh) decides before every Bash call: one plain line of a few known commands, with no
    # quoting, expansion, pipe or redirection, and none of gh's --jq, -q, --template or -t, which read
    # the environment. On top of that, CLAUDE_CODE_SUBPROCESS_ENV_SCRUB keeps the Claude OAuth token
    # out of every Bash command's and hook's environment; the GitHub token gh needs stays. A command
    # the review was denied, or the guard refused, shows as a warning on the run (last step): allow it
    # only when it can neither read nor write a file it is given, nor print the environment, and then
    # in the four places that list the commands together: --allowedTools, bash-guard.sh, the prompt
    # and docs/ci.md.
    #
    # Claude Code's native Linux build has no Grep or Glob tool unless --tools names them, and its
    # Bash grep and find are refused here, so --tools lists every tool the review uses (the mode
    # step's list, with Edit only with fix): without it the review couldn't search the checkout at
    # all. A tool the review needs and doesn't have goes there too.
    #
    # Some of the skill's recipes start review agents in the background, and the action ends the
    # session at the first result Claude reports, before any agent has finished: the run ended green
    # without posting anything (anthropics/claude-code-action#1646). Background tasks are turned off
    # so the agents run in the foreground, and the tools for waiting on them are blocked.
    #
    # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs every Bash command in Claude Code's sandbox, which on Linux
    # needs bubblewrap and socat. The runner has neither, and without them every Bash call failed, so
    # the review had no diff. Ubuntu's AppArmor also keeps an unprivileged user from creating the user
    # namespace bubblewrap needs; the runner is a throwaway VM, so that restriction is lifted here.
    # The step warns when the sandbox still can't start, so a run that reviews without Bash shows it.
    - name: Install the sandbox's dependencies
      shell: bash
      run: |
        # The package index is only refreshed when the image's own is too old to install them.
        install_sandbox() { sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat > /dev/null; }
        if ! command -v bwrap > /dev/null || ! command -v socat > /dev/null; then
          install_sandbox || { sudo apt-get update -qq && install_sandbox; } || true
        fi
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if ! command -v socat > /dev/null || ! bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true; then
          echo "::warning::bubblewrap can't start a sandbox on this runner, so the review's Bash commands will fail."
        fi

    - id: claude
      uses: anthropics/claude-code-action@v1
      env:
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        settings: |
          {"hooks": {"PreToolUse": [{"matcher": "Bash", "hooks": [{"type": "command", "command": "${{ steps.tools.outputs.dir }}/bash-guard.sh ${{ steps.tools.outputs.state }}"}]}], "Stop": [{"hooks": [{"type": "command", "command": "${{ steps.tools.outputs.dir }}/stop-hook.sh ${{ steps.tools.outputs.state }} ${{ steps.tools.outputs.started }} ${{ inputs.fix }}", "timeout": 600}]}]}}
        prompt: |
          Review pull request #${{ github.event.pull_request.number }} of this repository: invoke the
          `code-review` skill once, with `${{ steps.mode.outputs.arguments }}` as its arguments,
          ${{ steps.mode.outputs.task }}

          End your reply with the skill's findings as a JSON array inside a ```json fence, and nothing
          after it: one object per finding, most severe first, each with "file", "line" (in the new
          version of the file), "summary", "failure_scenario", "category" and "severity", plus
          "start_line" when the finding spans lines, and "fix" and "suggestion" as described
          below${{ steps.mode.outputs.outcome }}. Write `[]` when there are none.
          ${{ steps.mode.outputs.posting }} Don't post anything to GitHub yourself, don't run the
          app, ${{ steps.mode.outputs.editing }}

          - "severity" is one of:
            - "must-fix": the change shouldn't merge with it: a bug users would hit (a crash, wrong
              data, data loss, a broken flow), a security hole, a race that corrupts state.
            - "should-fix": a real problem worth fixing in this pull request, with a limited impact:
              an edge case, error handling that degrades the experience, a CLAUDE.md or maintainer
              convention the change breaks, a cleanup that clearly pays off.
            - "nitpick": optional: naming, wording, a small simplification, style the tooling
              doesn't enforce.
          - "fix": one or two sentences on how to fix it, written for the author. Markdown is fine,
            with a short code sketch in a fenced block when the fix spans several places.
          - "suggestion": only when replacing lines "start_line" to "line" (or "line" alone) of the
            file, and nothing else, fully fixes the finding: the exact text that replaces those
            lines, every line whole and indented as in the file. Read those lines from the reviewed
            commit's copy, `${{ steps.tools.outputs.reviewed }}/<file>`, instead of recalling them,
            and keep "line" and "start_line" on exactly the lines it replaces. An empty string
            deletes them. Leave "suggestion" out whenever it would only be a sketch, the fix touches
            other lines, or the working tree already holds the fix.

          Take the pull request's diff from `gh pr diff ${{ github.event.pull_request.number }}`, and
          read files with the Read, Grep and Glob tools. Bash only runs gh pr view/diff/list, gh issue
          view/list, gh search, git status and git branch --show-current, each as one plain line: no
          quotes, pipes, redirections or shell variables, and no --jq, --template, -q or -t.
          A search runs without quotes. A symlink that leaves the checkout or enters .git, .github or
          .claude was removed before the review, so git status shows it as deleted: that isn't part of
          the change.

          ${{ steps.memory-instructions.outputs.text }}
          ${{ steps.earlier.outputs.text }}
          ${{ inputs.instructions }}
        claude_args: >-
          --model opus
          --tools "${{ steps.mode.outputs.tools }}"
          --allowedTools "Skill(code-review),Read(/${{ github.workspace }}/**),Read(/${{ steps.tools.outputs.reviewed }}/**),Read(~/.claude/projects/**),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git status:*),Bash(git branch --show-current)${{ steps.mode.outputs.allowed }}"
          --disallowedTools "${{ steps.mode.outputs.denied }}Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(/${{ runner.temp }}/**),Read(//tmp/**),Read(/${{ github.workspace }}/.git/**),Read(~/.ssh/**),Read(~/.gnupg/**),Read(~/.config/**),Read(~/.docker/**),Read(~/.gradle/**),Read(~/.m2/**),Read(~/.git-credentials),Read(~/.gitconfig),Read(~/.netrc),Read(~/.npmrc),Read(~/.claude.json),Read(~/.claude/.credentials.json),Read(~/actions-runner/**),Read(~/runners/**),ScheduleWakeup,Monitor,SendMessage"

    # The Stop hook leaves a log of what it saw. A review this action posted since the review started
    # counts as posted by it, on whatever commit it landed. Its .posted marker (outside the checkout,
    # where the session can't write) counts when GitHub can't be read, or doesn't list the review yet
    # after a few tries, since the list can lag behind a review just posted. Otherwise the
    # findings of Claude's last message (extract-findings.py reads the ```json fence) are posted here,
    # with the workflow's token, and a notice when there is no findings list (a refusal, a skill that
    # stopped early, a session that never ran: an expired token), so the pull request shows the run.
    # The one case with no notice is the job's timeout: GitHub cancels the job, and no step runs after
    # that; the failed check is the signal. A cancelled run (a newer run of the same pull request took
    # its place, or someone stopped it) posts nothing either. Only the hook commits fixes, while the
    # App's token is valid: when it pushed some and then didn't post, the review here still lists them
    # as fixed by that commit (post-review.sh checks the commit the .pushed marker names); otherwise
    # every finding is an inline comment.
    - name: Post the findings when the hook didn't
      if: ${{ !cancelled() && steps.tools.outputs.dir != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TOOLS: ${{ steps.tools.outputs.dir }}
        STATE: ${{ steps.tools.outputs.state }}
        STARTED: ${{ steps.tools.outputs.started }}
      run: |
        # The log quotes what the hook found, so it is printed through the same mask as the review.
        if [ -f "$STATE/.hook-log" ]; then
          "$TOOLS/post-review.sh" --redact < "$STATE/.hook-log" || echo "::warning::The Stop hook's log couldn't be printed."
        else
          echo "The Stop hook left no log: it didn't run."
        fi
        # GitHub's list of reviews can lag behind a review just posted, so with the hook's marker in
        # place the lookup is tried a few more times, and then the marker is trusted.
        for attempt in 1 2 3 4; do
          if posted=$("$TOOLS/post-review.sh" --already "$PR_NUMBER"); then
            echo "The review was posted from the session: $posted"
            exit 0
          elif [ $? -eq 2 ] && [ -f "$STATE/.posted" ]; then
            echo "::warning::GitHub's reviews couldn't be read, so the hook's marker is trusted and nothing more is posted."
            exit 0
          fi
          [ -f "$STATE/.posted" ] || break
          if [ "$attempt" -eq 4 ]; then
            echo "::warning::GitHub doesn't list the review the Stop hook posted yet, so its marker is trusted and nothing more is posted."
            exit 0
          fi
          sleep 10
        done
        echo "::warning::The session's Stop hook didn't post the review, so the findings were posted with the workflow's token."
        if [ -f "$STATE/.pushed" ]; then
          FIXED_IN=$(cat "$STATE/.pushed")
          export FIXED_IN
        fi
        if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
          echo "The session left no execution file: it didn't run."
          "$TOOLS/post-review.sh" "$PR_NUMBER" < /dev/null
          exit 0
        fi
        jq -r '[.[] | select(.type == "result")] | last | .result // ""' "$EXECUTION_FILE" |
          python3 "$TOOLS/extract-findings.py" |
          "$TOOLS/post-review.sh" "$PR_NUMBER"

    # The action hides Claude's output, since this repository's logs are public, so a tool the review
    # was denied doesn't show anywhere. Only the tool's name is printed, and for Bash the program (a
    # path to a script counts), its flags and its subcommand (two for gh, whose verbs come in pairs),
    # enough to allow it above: a word that doesn't look like one (a path argument, a value, an
    # assignment) is left out. A compound command (&&, ||, |, ;) is denied as a whole when one of its
    # parts isn't allowed, so every part is printed, joined with "+". A command the Bash guard refused
    # never reaches the permission rules, so it is in the guard's log instead, in the same shape, and
    # goes through the review's mask, since a refused command's first word could be anything. Reading
    # either never fails the review.
    - name: List the tools the review was denied
      if: always() && steps.tools.outputs.dir != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        TOOLS: ${{ steps.tools.outputs.dir }}
        STATE: ${{ steps.tools.outputs.state }}
      run: |
        if [ -f "$STATE/.guard-log" ]; then
          "$TOOLS/post-review.sh" --redact < "$STATE/.guard-log" | sort | uniq -c | while read -r count tool; do
            echo "::warning::The review's Bash guard refused $tool ($count time(s))."
          done || echo "::warning::Couldn't read the commands the Bash guard refused."
        fi
        [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ] || exit 0
        if ! denied=$(jq -r '.[] | select(.type == "result") | .permission_denials[]?
          | if .tool_name == "Bash"
            then [.tool_input.command // "" | split("\n")[0] | splits("\\s*(&&|\\|\\||\\||;)\\s*") | select(. != "")]
              | map([splits("\\s+") | select(. != "" and (test("^[A-Za-z_][A-Za-z0-9_]*=") | not))]
                | "Bash("
                  + ([(.[0] // "" | select(test("^[A-Za-z./][A-Za-z0-9._/-]*$")) // "?"),
                      (.[1] // "" | select(test("^(-[A-Za-z0-9-]*|[a-z][a-z0-9-]*)$"))),
                      (if .[0] == "gh" then (.[2] // "" | select(test("^[a-z][a-z0-9-]*$"))) else empty end)]
                     | join(" "))
                  + ")")
              | join(" + ")
            else .tool_name end' "$EXECUTION_FILE"); then
          echo "::warning::Couldn't read the tools the review was denied."
          exit 0
        fi
        [ -n "$denied" ] || exit 0
        sort <<< "$denied" | uniq -c | while read -r count tool; do
          echo "::warning::The review was denied $tool ($count time(s))."
        done
