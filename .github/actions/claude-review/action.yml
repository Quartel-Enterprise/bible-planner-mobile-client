name: 'Claude review'
description: 'Reviews the pull request with the /code-review skill bundled with Claude Code, at high effort, and posts the findings as one review'

# The review step only reviews. The findings come back as JSON in Claude's last message, and the
# posting step below hands them to post-review.sh, which posts them as one pull request review with
# the workflow's token. Claude itself posts nothing: the skill's --comment flag posts one review per
# finding, each with its own notification, and a script run by Claude depends on a Bash allowlist the
# action didn't honour for it.

inputs:
  oauth-token:
    description: 'The CLAUDE_CODE_OAUTH_TOKEN secret.'
    required: true
  instructions:
    description: 'Extra instructions appended to the review prompt.'
    required: false
    default: ''
  memory-ssh-key:
    description: 'The AGENT_MEMORY_DEPLOY_KEY secret: a read-only deploy key of the private agent memory repository.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # The agent memories live in a private repository, since this one is public. Only the feedback_*
    # ones, the conventions the maintainer asked for, reach the runner: the project_* ones and the
    # index hold figures and ids a comment must never repeat. Without the key, or when the checkout
    # fails, the review still runs, only without them.
    - id: memory
      if: inputs.memory-ssh-key != ''
      continue-on-error: true
      uses: actions/checkout@v6
      with:
        repository: PierreVieira/bible-planner-agent-memory
        ssh-key: ${{ inputs.memory-ssh-key }}
        path: .agent-memory
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: |
          feedback_*.md
        sparse-checkout-cone-mode: false

    # Excluded from the pull request's checkout, so the review's searches over the repository skip it.
    # The review's own recipe asks the model to quote the rule behind a conventions finding; for these
    # private conventions it is told to paraphrase instead.
    - id: memory-instructions
      shell: bash
      env:
        MEMORY_OUTCOME: ${{ steps.memory.outcome }}
      run: |
        if [ "$MEMORY_OUTCOME" != success ]; then
          echo "::warning::The agent memories weren't checked out, so the review runs without them."
          exit 0
        fi
        echo ".agent-memory/" >> .git/info/exclude
        {
          echo "text<<MEMORY_INSTRUCTIONS_END"
          echo "The maintainer's conventions for this repository are in .agent-memory/feedback_*.md,"
          echo "one per file: read them all and treat them with the same weight as CLAUDE.md."
          echo "They are private and this repository is public: cite a convention in your own words,"
          echo "never quote a file or name its path in a finding, even where the review's recipe"
          echo "asks you to quote the rule. .agent-memory is not part of the pull request: never"
          echo "review it."
          echo "MEMORY_INSTRUCTIONS_END"
        } >> "$GITHUB_OUTPUT"

    # The review can't read the inline comments on the pull request, so the ones Claude left before
    # (a draft marked ready a second time, a review on request after new pushes) are handed to it, for
    # it not to raise the same issues again.
    - id: earlier
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        comments=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/comments" \
          --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == "claude[bot]")
            | "- \(.path):\(.line // .original_line): \(.body | gsub("\\s+"; " ") | .[0:300])"')
        {
          echo "text<<EARLIER_COMMENTS_END"
          if [ -n "$comments" ]; then
            echo "Claude reviewed this pull request before and left these comments. Don't report an"
            echo "issue one of them already raised:"
            echo "$comments"
          fi
          echo "EARLIER_COMMENTS_END"
        } >> "$GITHUB_OUTPUT"

    # The same review as the create-pr skill runs before the pull request opens, the /code-review
    # skill bundled with Claude Code at high effort, on Opus (see docs/ci.md, "AI review"). The model
    # invokes the skill itself, with the level and the pull request number as its only arguments:
    # put on the skill's command line, the instructions below would become part of its target.
    #
    # Without a tool to report through, the skill returns its findings as a JSON array, which is what
    # the posting step reads from Claude's last message. The gh and git commands are the read-only
    # ones the skill runs; the checkout has no history (fetch-depth 1), so the git ones only serve the
    # diff. A command the review was denied shows as a warning on the run (last step), to be allowed
    # here when the review needs it.
    #
    # Some of the skill's recipes start review agents in the background, and the action ends the
    # session at the first result Claude reports, before any agent has finished: the run ended green
    # without posting anything (anthropics/claude-code-action#1646). Background tasks are turned off
    # so the agents run in the foreground, and the tools for waiting on them are blocked.
    - id: claude
      uses: anthropics/claude-code-action@v1
      env:
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        prompt: |
          Review pull request #${{ github.event.pull_request.number }} of this repository: invoke the
          `code-review` skill once, with `high ${{ github.event.pull_request.number }}` as its
          arguments, and wait for its findings.

          End your reply with the skill's findings as a JSON array inside a ```json fence, and nothing
          after it: one object per finding, most severe first, each with "file", "line" (in the new
          version of the file), "summary", "failure_scenario" and "category", plus "start_line" when
          the finding spans lines. Write `[]` when there are none. A later step posts that array as
          one pull request review. Don't post anything to GitHub yourself, don't run the app, don't
          invoke any other skill and don't edit any file.

          ${{ steps.memory-instructions.outputs.text }}
          ${{ steps.earlier.outputs.text }}
          ${{ inputs.instructions }}
        claude_args: >-
          --model opus
          --allowedTools "Skill(code-review),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*),Bash(git branch --show-current),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(grep:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(cd:*)"
          --disallowedTools "ScheduleWakeup,Monitor,SendMessage"

    # Claude's last message ends with the findings in a ```json fence (the last one, should the skill
    # print more than one); a reply that is nothing but the array counts too. Without either, the
    # review ended without a findings list (a timeout, a refusal, a skill that stopped early): a review
    # saying so is posted, so the pull request shows the run, and the run shows a warning.
    - name: Post the findings as one review
      if: always() && steps.claude.outputs.execution_file != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        result=$(jq -r '[.[] | select(.type == "result")] | last | .result // ""' "$EXECUTION_FILE")
        findings=$(awk '
          /^[[:space:]]*```json[[:space:]]*$/ { buf = ""; inside = 1; next }
          /^[[:space:]]*```[[:space:]]*$/ { if (inside) { last = buf; inside = 0 }; next }
          inside { buf = buf $0 "\n" }
          END { printf "%s", last }' <<< "$result")
        if ! jq -e 'type == "array"' <<< "$findings" > /dev/null 2>&1; then
          if jq -e 'type == "array"' <<< "$result" > /dev/null 2>&1; then
            findings=$result
          else
            echo "::warning::The review ended without a findings list, so only a notice was posted."
            jq -n --arg url "$RUN_URL" '{event: "COMMENT",
              body: ("### Code review\n\nThe review ended without a findings list; see [the run](" + $url + ").")}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --input - --jq .html_url
            exit 0
          fi
        fi
        .github/actions/claude-review/post-review.sh "$PR_NUMBER" <<< "$findings"

    # The action hides Claude's output, since this repository's logs are public, so a tool the review
    # was denied doesn't show anywhere. Only the tool's name is printed, and for Bash the program (a
    # path to a script counts), its flags and its subcommand (two for gh, whose verbs come in pairs),
    # enough to allow it above: a word that doesn't look like one (a path argument, a value, an
    # assignment) is left out. Reading the file never fails the review.
    - name: List the tools the review was denied
      if: always() && steps.claude.outputs.execution_file != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: |
        if ! denied=$(jq -r '.[] | select(.type == "result") | .permission_denials[]?
          | if .tool_name == "Bash"
            then [.tool_input.command // "" | splits("\\s+") | select(. != "")]
              | map(select(test("^[A-Za-z_][A-Za-z0-9_]*=") | not))
              | "Bash("
                + ([(.[0] // "" | select(test("^[A-Za-z./][A-Za-z0-9._/-]*$")) // "?"),
                    (.[1] // "" | select(test("^(-[A-Za-z0-9-]*|[a-z][a-z0-9-]*)$"))),
                    (if .[0] == "gh" then (.[2] // "" | select(test("^[a-z][a-z0-9-]*$"))) else empty end)]
                   | join(" "))
                + ")"
            else .tool_name end' "$EXECUTION_FILE"); then
          echo "::warning::Couldn't read the tools the review was denied."
          exit 0
        fi
        [ -n "$denied" ] || exit 0
        sort <<< "$denied" | uniq -c | while read -r count tool; do
          echo "::warning::The review was denied $tool ($count time(s))."
        done
