name: 'Claude review'
description: 'Reviews the pull request with the official code-review plugin and posts the findings as inline comments'

inputs:
  oauth-token:
    description: 'The CLAUDE_CODE_OAUTH_TOKEN secret.'
    required: true
  instructions:
    description: 'Extra instructions appended to the /code-review command.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # The same review as /code-review in the create-pr skill. The --allowedTools line has to stay:
    # the action only starts the server that posts inline comments when it names that tool. The gh
    # commands are the ones the plugin runs, allowed for its subagents too.
    #
    # The plugin starts its review agents in the background, and the action ends the session at the
    # first result Claude reports, which then comes before any agent has finished: the run ended
    # green without posting anything (anthropics/claude-code-action#1646). Background tasks are
    # turned off so the agents run in the foreground, and the tools for waiting on them are blocked.
    - uses: anthropics/claude-code-action@v1
      env:
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        plugin_marketplaces: https://github.com/anthropics/claude-code.git
        plugins: code-review@claude-code-plugins
        prompt: >-
          /code-review:code-review --comment
          ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          ${{ inputs.instructions }}
        claude_args: >-
          --model sonnet
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
          --disallowedTools "ScheduleWakeup,Monitor,SendMessage"
