name: 'Claude review'
description: 'Reviews the pull request with the /code-review skill bundled with Claude Code, at high effort, and posts the findings as inline comments'

inputs:
  oauth-token:
    description: 'The CLAUDE_CODE_OAUTH_TOKEN secret.'
    required: true
  instructions:
    description: 'Extra instructions appended to the /code-review command.'
    required: false
    default: ''
  memory-ssh-key:
    description: 'The AGENT_MEMORY_DEPLOY_KEY secret: a read-only deploy key of the private agent memory repository.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # The agent memories live in a private repository, since this one is public. Only the feedback_*
    # ones, the conventions the maintainer asked for, reach the runner: the project_* ones and the
    # index hold figures and ids a comment must never repeat. Without the key, or when the checkout
    # fails, the review still runs, only without them.
    - id: memory
      if: inputs.memory-ssh-key != ''
      continue-on-error: true
      uses: actions/checkout@v6
      with:
        repository: PierreVieira/bible-planner-agent-memory
        ssh-key: ${{ inputs.memory-ssh-key }}
        path: .agent-memory
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: |
          feedback_*.md
        sparse-checkout-cone-mode: false

    # Excluded from the pull request's checkout, so the review's searches over the repository skip it.
    - id: memory-instructions
      shell: bash
      env:
        MEMORY_OUTCOME: ${{ steps.memory.outcome }}
      run: |
        if [ "$MEMORY_OUTCOME" != success ]; then
          echo "::warning::The agent memories weren't checked out, so the review runs without them."
          exit 0
        fi
        echo ".agent-memory/" >> .git/info/exclude
        {
          echo "text<<MEMORY_INSTRUCTIONS_END"
          echo "The maintainer's conventions for this repository are in .agent-memory/feedback_*.md,"
          echo "one per file: read them all and treat them with the same weight as CLAUDE.md."
          echo "They are private and this repository is public: cite a convention in your own words,"
          echo "never quote a file or name its path in a comment. .agent-memory is not part of the"
          echo "pull request: never review it."
          echo "MEMORY_INSTRUCTIONS_END"
        } >> "$GITHUB_OUTPUT"

    # The same review as the create-pr skill runs before the pull request opens: the /code-review
    # skill bundled with Claude Code, at high effort, which hunts for correctness bugs and for reuse,
    # simplification and efficiency cleanups in the changed code, as far as the recipe of the model
    # covers them. It reviews on Opus; locally it runs on the model of the author's session, with
    # that model's recipe. The code-review plugin of the official marketplace, used
    # before, is a different recipe (five Sonnet agents, bugs and CLAUDE.md violations only, nothing
    # under 80% confidence), so it answered "No issues found" to pull requests the local review had
    # findings on.
    #
    # The pull request number is the review target: the skill reads it with gh from the checkout.
    # --comment posts each finding as an inline comment through the action's inline-comment server,
    # which only starts when --allowedTools names its tool, so that line has to stay. The gh and git
    # commands are the read-only ones the skill and its agents run; one the review was denied shows
    # as a warning on the run (next step), to be allowed here when the review needs it. The skill is
    # told to stop at the comments: left alone, it may go on to check that the change runs.
    #
    # Some of the skill's recipes start review agents in the background (the plugin always did), and
    # the action ends the session at the first result Claude reports, which then comes before any
    # agent has finished: the run ended green without posting anything
    # (anthropics/claude-code-action#1646). Background tasks are turned off so the agents run in the
    # foreground, and the tools for waiting on them are blocked.
    - id: claude
      uses: anthropics/claude-code-action@v1
      env:
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        prompt: >-
          /code-review high --comment ${{ github.event.pull_request.number }}
          Stop once the findings are posted: don't run the app, invoke another skill or edit any file.
          ${{ steps.memory-instructions.outputs.text }}
          ${{ inputs.instructions }}
        claude_args: >-
          --model opus
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*),Bash(git branch --show-current),Bash(git rev-parse:*),Bash(git merge-base:*)"
          --disallowedTools "ScheduleWakeup,Monitor,SendMessage"

    # The action hides Claude's output, since this repository's logs are public, so a tool the review
    # was denied doesn't show anywhere. Only the tool's name is printed, and for Bash the program and
    # its subcommand, enough to allow it above: a word that doesn't look like one (a path, an
    # argument, an assignment) is left out. Reading the file never fails the review.
    - name: List the tools the review was denied
      if: always() && steps.claude.outputs.execution_file != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: |
        if ! denied=$(jq -r '.[] | select(.type == "result") | .permission_denials[]?
          | if .tool_name == "Bash"
            then [.tool_input.command // "" | splits("\\s+") | select(. != "")]
              | map(select(test("^[A-Za-z_][A-Za-z0-9_]*=") | not))
              | "Bash("
                + ([(.[0] // "" | select(test("^[A-Za-z][A-Za-z0-9._-]*$")) // "?"),
                    (.[1] // "" | select(test("^[a-z][a-z0-9-]*$")))] | join(" "))
                + ")"
            else .tool_name end' "$EXECUTION_FILE"); then
          echo "::warning::Couldn't read the tools the review was denied."
          exit 0
        fi
        [ -n "$denied" ] || exit 0
        sort <<< "$denied" | uniq -c | while read -r count tool; do
          echo "::warning::The review was denied $tool ($count time(s))."
        done
