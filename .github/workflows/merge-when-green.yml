name: merge-when-green

# Squash merges a pull request labeled merge-when-green once every check on its head commit has
# passed, required or not. GitHub's own auto-merge only waits for the required checks, so it would
# merge before the ui-tests finish.
#
# It runs when the label is added (the checks may already be green) and whenever one of the pull
# request workflows completes (the last one to finish is the one that finds everything green).
#
# A green pull request with an unresolved review conversation (a finding of claude-review, say) is
# not merged: the label goes and a comment says why. Resolving a conversation starts no workflow, so
# adding the label again is what merges it then. The checks review-gate held for those conversations
# (see review-gate.yml) don't count as failed: once every conversation is resolved, this workflow
# re-runs them and merges when they pass.
on:
  pull_request:
    types:
      - labeled
  workflow_run:
    workflows:
      - build-and-test
      - ui-tests
      - screenshot-tests
      - static-analysis
      - module-graph
      - translations
      - claude-review
      - claude-review-on-request
    types:
      - completed

permissions:
  contents: read

jobs:
  merge:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'merge-when-green') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    concurrency:
      group: merge-when-green-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/review_gate.sh
          sparse-checkout-cone-mode: false

      # A merge made with GITHUB_TOKEN triggers no other workflow, so neither the push to main
      # (build-and-test, ui-tests, translations…) nor cleanup-pr-caches would run. The merge is made
      # with a token of its own instead: a fine-grained personal access token restricted to this
      # repository, with Contents and Pull requests set to Read and write.
      - name: Merge the pull request if every check passed
        env:
          GH_TOKEN: ${{ secrets.MERGE_WHEN_GREEN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || 0 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The MERGE_WHEN_GREEN_TOKEN secret is not set."
            exit 1
          fi

          # Matching on the head commit ignores a pull request that was pushed to after these
          # checks started: its new commit brings checks of its own.
          pr=$(gh pr list --state open --label merge-when-green --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "No open pull request labeled merge-when-green has $HEAD_SHA as its head."
            exit 0
          fi

          # gh exits with 8 while checks are pending and with 1 when one failed or none exists yet.
          # Those are answers here, not errors, so the JSON it prints is what gets inspected.
          checks=$(gh pr checks "$pr" --json name,workflow,bucket) || true
          if ! jq -e 'type == "array"' <<< "$checks" > /dev/null 2>&1; then
            echo "#$pr has no checks yet."
            exit 0
          fi
          others=$(jq '[.[] | select(.workflow != "merge-when-green")]' <<< "$checks")

          # check-translations runs on every pull request, alongside the other workflows of the
          # same push. Until it shows up, those workflows may not have registered their checks yet.
          if ! jq -e 'any(.name == "check-translations")' <<< "$others" > /dev/null; then
            echo "The checks of #$pr are not registered yet."
            exit 0
          fi

          # A gate that held its workflow's checks for claude-review's open threads is the only
          # review-gate check that fails. Its run completes failed, which starts this workflow too.
          held=$(jq '[.[] | select((.name | startswith("review-gate")) and .bucket == "fail")] | length' <<< "$others")
          unfinished=$(jq -r '.[] | select(.bucket != "pass" and .bucket != "skipping")
            | select(((.name | startswith("review-gate")) and .bucket == "fail") | not)
            | "\(.name): \(.bucket)"' <<< "$others")
          if [ -n "$unfinished" ]; then
            echo "#$pr is not green yet:"
            echo "$unfinished"
            exit 0
          fi

          # A job waiting on another (the checks behind review-gate) has no check until it starts, so
          # for a moment after review-gate passes every check is green while its workflow still has
          # jobs to run. A run of a workflow that calls review-gate counts as unfinished until it
          # completes; its completion starts this workflow again. Only those: a run started by a label
          # (claude-review-on-request, record-screenshots) skips its job and may not start this one.
          # The run that started this one counts as complete whatever the listing says, which can lag
          # behind the event.
          running=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed" and .id != (env.TRIGGER_RUN_ID | tonumber))
              | select(.path | test("^\\.github/workflows/(build-and-test|ui-tests|screenshot-tests|static-analysis|module-graph)\\.yml$"))
              | .name')
          if [ -n "$running" ]; then
            echo "#$pr still has workflows running:"
            echo "$running"
            exit 0
          fi

          # The ruleset refuses the merge too, but checking first leaves a comment on the pull request
          # instead of a failed run nobody looks at.
          unresolved=$(GH_TOKEN="$GITHUB_TOKEN" ./scripts/review_gate.sh open-threads "$pr")
          if [ "$unresolved" -gt 0 ]; then
            echo "#$pr is green but has $unresolved unresolved review conversation(s)."
            if [ "$held" -gt 0 ]; then
              body="The checks are held for the Claude review's threads, and $unresolved review"
              body+=" conversation(s) are still unresolved, so this was not merged. Fix each one, or reply"
              body+=" with why it stays as it is, resolve them, then add the \`merge-when-green\` label"
              body+=" again: the held checks run then, and this merges once they pass."
            else
              body="Every check passed, but $unresolved review conversation(s) are still unresolved, so this"
              body+=" was not merged. Fix each one, or reply with why it stays as it is, resolve them, then"
              body+=" add the \`merge-when-green\` label again."
            fi
            GH_TOKEN="$GITHUB_TOKEN" gh pr comment "$pr" --body "$body"
            GH_TOKEN="$GITHUB_TOKEN" gh api --method DELETE "repos/$GH_REPO/issues/$pr/labels/merge-when-green" > /dev/null
            exit 0
          fi

          # Every conversation is resolved now, so the gate lets the held checks through; their
          # completion starts this workflow again.
          if [ "$held" -gt 0 ]; then
            rerun=$(GH_TOKEN="$GITHUB_TOKEN" ./scripts/review_gate.sh rerun-held "$HEAD_SHA")
            echo "Re-ran $rerun run(s) of #$pr held for review conversations that are resolved now."
            exit 0
          fi

          gh pr merge "$pr" --squash --match-head-commit "$HEAD_SHA"

          # The label only means "merge this once it is green", so it goes once that is done.
          gh api --method DELETE "repos/$GH_REPO/issues/$pr/labels/merge-when-green" > /dev/null
