name: build-and-test

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'store_listings/**'
      - 'fastlane/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'store_listings/**'
      - 'fastlane/**'

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one. On main every commit has a group
# of its own and always finishes: a cancelled run saves no Gradle cache, so main's entries would fall
# behind and the next pull requests would recompile from scratch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # verifyNewFilesCoverage diffs against the tip of the base branch, which a depth-1 checkout of
      # the pull request's merge commit does not bring. On main the diff is empty and the task passes.
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      # jvmTest stays next to the Kover tasks: :ui:* has tests but is left out of the coverage
      # report, so the Kover tasks alone would not run them. See docs/code-quality.md.
      # The desktop app is compiled here and not in build: jvmTest already compiles the jvm target
      # of every module it depends on, so it only adds :desktopApp itself, while in build it
      # compiled the whole jvm target a second time on top of the Android one.
      - name: Run unit tests, verify coverage and compile the desktop app
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: >
          ./gradlew jvmTest :koverVerifyCi :verifyNewFilesCoverage :koverHtmlReportCi
          :desktopApp:compileKotlin -Pcoverage.baseRef="origin/$BASE_REF" --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/

  build:
    runs-on: ubuntu-latest
    # The longest job, see .github/actions/gradle. unit-tests stays read-only: every writer takes
    # its share of the 10 GB budget, and a pull request rarely changes enough for main's entry to
    # stop paying off.
    env:
      GRADLE_CACHE_WRITE_ON_PULL_REQUESTS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The google-services plugin refuses to build without its file. The real one lives only in the
      # Production environment, which needs a manual approval, so this compile check builds with
      # placeholder values instead. Without local.properties BuildKonfig bakes empty keys, which is
      # fine for an app nothing runs.
      - name: Write a placeholder google-services.json
        run: ./scripts/write_placeholder_google_services.sh

      # Release matters: it is the only variant where R8 runs, so a missing keep rule surfaces here
      # instead of on a device. Without the signing secrets it is signed with the debug key, which
      # is all a compile check needs. :androidApp already compiles every production module for
      # Android; the jvm target and the desktop app are compiled by unit-tests.
      - name: Assemble the Android release
        run: ./gradlew :androidApp:assembleRelease
