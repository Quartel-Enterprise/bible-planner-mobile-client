name: module-graph

# The module graph only changes with build scripts, build-logic, the version catalog or the Gradle
# version, so Kotlin-only changes skip the full Gradle configuration this check needs.
on:
  pull_request:
    paths:
      - '.github/workflows/module-graph.yml'
      - '.github/actions/gradle/action.yml'
      - '**/*.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/module-graph.yml'
      - '.github/actions/gradle/action.yml'
      - '**/*.gradle.kts'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  module-graph:
    runs-on: ubuntu-latest
    # The check only configures the build and compiles nothing, so there is no state worth saving.
    # See .github/actions/gradle.
    env:
      GRADLE_CACHE_READ_ONLY: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Assert module graph
        run: ./gradlew assertModuleGraph
