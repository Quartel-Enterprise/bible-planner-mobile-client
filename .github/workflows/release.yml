name: release

# Release pipeline — versions, builds and ships Bible Planner to the stores.
#
# Run it manually from the Actions tab:
#   1. `plan` resolves the version — auto-inferred from the commits since the
#      last release, or taken from the optional `version` input — and shows it
#      in the run summary.
#   2. The run pauses on the `Production` environment. Review the planned
#      version in the summary, then approve to continue (or reject and start a
#      new run with the `version` input to override).
#   3. Android and iOS are built and uploaded to the stores, and the desktop
#      installers are built on one runner per OS.
#   4. `finalize` bumps the version on a release branch, opens and squash-merges
#      the merge-back PR into main, and publishes the GitHub release with the
#      desktop installers attached as assets. It runs for the `all` and `mobile`
#      platform selections — the store release is what the tag and the version
#      bump record, so a mobile-only run must still finalize.
#
# Pre-release mode (`prerelease: true`) ships a beta build that never reaches
# the public: Android goes to the Play internal track, iOS to TestFlight only
# (no review submission) and desktop is skipped. The release is named
# X.Y.Z-beta-N (N auto-incremented from the existing beta tags) — the suffix
# lands on the Android versionName, the tag and the GitHub release, which is
# published with the pre-release flag. Apple rejects suffixed version strings,
# so the iOS build keeps the plain X.Y.Z and is told apart by its build number.
# `finalize` still runs, committing only the versionCode (the versionName in
# version.xcconfig stays at the last stable until the real release).
#
# Secrets live exclusively in the `Production` environment.
#
# The desktop installers are unsigned: macOS Gatekeeper and Windows SmartScreen
# will warn on first launch until code signing and notarization are set up.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z — leave blank to auto-infer from commits"
        type: string
        required: false
      platforms:
        description: "Platforms to release (mobile = android + ios)"
        type: choice
        options:
          - all
          - mobile
          - android
          - ios
          - desktop
        default: all
      track:
        description: "Android Play Store track (ignored for pre-releases — forced to internal)"
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal
        default: production
      complete_android_release:
        description: "Roll out the Android release (uncheck to upload it as a draft)"
        type: boolean
        default: true
      submit_ios_for_review:
        description: "Submit the iOS build for App Store review (uncheck for a test run; ignored for pre-releases — forced off)"
        type: boolean
        default: true
      prerelease:
        description: "Pre-release (beta): mobile only, Play internal track, TestFlight without review, GitHub pre-release tagged X.Y.Z-beta-N"
        type: boolean
        default: false

# Least privilege by default — only the finalize job needs write access.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      display_version: ${{ steps.resolve.outputs.display_version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      branch: ${{ steps.resolve.outputs.branch }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      # A single-platform pre-release would skip finalize, leaving its
      # versionCode uncommitted — the next run would reuse it and Google Play
      # rejects duplicate codes.
      - name: Validate pre-release inputs
        if: ${{ inputs.prerelease && inputs.platforms != 'all' && inputs.platforms != 'mobile' }}
        run: |
          echo "::error::A pre-release must run with platforms 'all' or 'mobile' so finalize can commit the versionCode bump."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: ./scripts/suggest-version.sh "${{ inputs.version }}"
        env:
          PRERELEASE: ${{ inputs.prerelease }}

  android-build:
    name: Android — build the AAB
    needs: plan
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mobile' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      # Android takes the display version: Play accepts a suffixed versionName,
      # so beta builds carry X.Y.Z-beta-N (on stable runs it equals X.Y.Z).
      - name: Bump version
        run: ./scripts/bump-version.sh "${{ needs.plan.outputs.display_version }}" "${{ needs.plan.outputs.version_code }}"

      - name: Setup Gradle and Java
        uses: ./.github/actions/gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Decode signing and build secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties

      - name: Build the signed AAB
        run: fastlane android build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload the AAB as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: androidApp/build/outputs/bundle/release/
          # Signed binaries are downloadable by anyone on a public repo — keep them short-lived.
          retention-days: 1
          if-no-files-found: error

  android-upload:
    name: Android — upload to Google Play
    needs: [plan, android-build]
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mobile' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Bump version
        run: ./scripts/bump-version.sh "${{ needs.plan.outputs.display_version }}" "${{ needs.plan.outputs.version_code }}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Decode the Play Store service account
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Download the AAB build artifact
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: androidApp/build/outputs/bundle/release/

      - name: Upload to Google Play
        run: fastlane android upload track:"${{ inputs.prerelease && 'internal' || inputs.track }}"
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
          COMPLETE_RELEASE: ${{ inputs.complete_android_release }}

  ios-build:
    name: iOS — build the IPA
    needs: plan
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mobile' || inputs.platforms == 'ios' }}
    runs-on: macos-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bump version
        run: ./scripts/bump-version.sh "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.version_code }}"

      - name: Setup Gradle and Java
        uses: ./.github/actions/gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Prepare SSH access to the certificates repo
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/match_ci_ssh"
          chmod 600 "$RUNNER_TEMP/match_ci_ssh"
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Decode Firebase config and local properties
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties

      - name: Build the signed IPA
        run: fastlane ios build
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match_ci_ssh -o IdentitiesOnly=yes

      - name: Upload the IPA as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/
          # Signed binaries are downloadable by anyone on a public repo — keep them short-lived.
          retention-days: 1
          if-no-files-found: error

  ios-upload:
    name: iOS — upload to App Store Connect
    needs: [plan, ios-build]
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mobile' || inputs.platforms == 'ios' }}
    runs-on: macos-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Bump version
        run: ./scripts/bump-version.sh "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.version_code }}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Download the IPA build artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: build/ios/

      - name: Upload to App Store Connect
        run: fastlane ios upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          SUBMIT_FOR_REVIEW: ${{ !inputs.prerelease && inputs.submit_ios_for_review }}

  desktop-build:
    name: Desktop — build the ${{ matrix.formats }}
    needs: plan
    # Pre-releases never build desktop: there is no store test track for it and
    # jpackage rejects a suffixed version anyway.
    if: ${{ !inputs.prerelease && (inputs.platforms == 'all' || inputs.platforms == 'desktop') }}
    runs-on: ${{ matrix.os }}
    environment: Production
    strategy:
      # One runner per OS: jpackage only builds the installers of the host system.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            formats: dmg
          - os: windows-latest
            label: windows
            formats: msi
          - os: ubuntu-latest
            label: linux
            formats: deb and rpm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Bump version
        shell: bash
        run: ./scripts/bump-version.sh "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.version_code }}"

      - name: Setup Gradle and Java
        uses: ./.github/actions/gradle

      # jpackage shells out to these to lay out the .deb and the .rpm; none are
      # preinstalled. Debian ships rpmbuild inside the `rpm` package.
      - name: Install the Linux packaging tools
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install --yes fakeroot binutils rpm

      - name: Decode local properties
        shell: bash
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> local.properties

      # No checkJdkVendor bypass here: the runner JDK is Temurin, and the guard
      # only ever fires on Homebrew's distribution.
      - name: Build the installers
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      # Guards the packaged runtime against a silently trimmed jlink image: a
      # missing jdk.unsupported cost us the sun.misc.Unsafe crash in 2.2.0.
      # Only macOS leaves an unpacked app image under binaries/; the jlink output
      # every OS embeds is compose/tmp/main/runtime, so search from compose/ and
      # check every image found.
      - name: Verify the runtime image carries the declared modules
        shell: bash
        run: |
          release_files=$(find desktopApp/build/compose -name release -path '*runtime*')
          if [ -z "$release_files" ]; then
            echo "::error::no runtime release file found in the build output"
            exit 1
          fi
          while IFS= read -r release_file; do
            echo "Runtime image: $release_file"
            for module in java.instrument java.management java.prefs jdk.security.auth jdk.unsupported; do
              grep -q "\b${module}\b" "$release_file" || {
                echo "::error::${module} is missing from ${release_file}"
                exit 1
              }
            done
          done <<EOF
          $release_files
          EOF

      # Each format lands in its own directory, so uploading them directly would
      # root the Linux artifact at `main/` and nest the files under deb/ and rpm/.
      # finalize globs the download for files, so collect them flat instead.
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p installers
          find desktopApp/build/compose/binaries/main -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} installers/ \;
          ls -lh installers

      - name: Upload the installers as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: installers/
          retention-days: 1
          if-no-files-found: error

  finalize:
    name: Tag, release notes and merge-back
    needs: [plan, android-upload, ios-upload, desktop-build]
    # `mobile` skips desktop-build, and a skipped dependency skips this job too
    # unless the condition carries a status check function — hence !cancelled(),
    # which replaces the implicit success() and forces the explicit result
    # checks below. Without them a failed upload would still be finalized.
    if: >-
      ${{ !cancelled()
      && (inputs.prerelease || inputs.track == 'production')
      && (inputs.platforms == 'all' || inputs.platforms == 'mobile')
      && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # A pre-release commits only the versionCode it consumed: versionName in
      # version.xcconfig stays at the last stable so the next run keeps
      # resolving the upcoming version from the release notes JSON.
      - name: Create release branch with version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ needs.plan.outputs.branch }}"
          if [ "${{ needs.plan.outputs.prerelease }}" = "true" ]; then
            current_version="$(grep -E '^versionName=' version.xcconfig | cut -d= -f2)"
            ./scripts/bump-version.sh "$current_version" "${{ needs.plan.outputs.version_code }}"
            git commit -am "chore: bump versionCode to ${{ needs.plan.outputs.version_code }} for ${{ needs.plan.outputs.display_version }}"
          else
            ./scripts/bump-version.sh "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.version_code }}"
            git commit -am "chore: bump version to ${{ needs.plan.outputs.version }}"
          fi
          git push -u origin "${{ needs.plan.outputs.branch }}"

      # A PR opened with GITHUB_TOKEN never triggers the translations workflow,
      # so the required check-translations context would never be reported and
      # the merge-back would stay blocked forever. Running the same script here
      # and publishing the result keeps the guard real, and GITHUB_TOKEN reports
      # it as the very GitHub Actions app the ruleset pins the context to.
      - name: Report check-translations for the merge-back branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_translations.py
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f name=check-translations \
            -f head_sha="$(git rev-parse HEAD)" \
            -f status=completed \
            -f conclusion=success

      - name: Open merge-back PR and squash into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ needs.plan.outputs.branch }}" \
            --title "chore: merge back ${{ needs.plan.outputs.display_version }} into main" \
            --body "Merges the ${{ needs.plan.outputs.display_version }} release (build ${{ needs.plan.outputs.version_code }}) back into main." \
            --label bump \
            --assignee "${{ github.actor }}"
          # GitHub recomputes mergeability asynchronously, so the merge right
          # after the create can still read the PR as blocked. Retry instead of
          # failing the release on a race that resolves itself in seconds.
          for _ in 1 2 3 4 5; do
            if gh pr merge "${{ needs.plan.outputs.branch }}" --squash --delete-branch; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      # Nothing to download on a mobile-only run: the step would fail on the
      # missing artifacts, and the release goes out without desktop assets.
      - name: Download the desktop installers
        if: ${{ needs.desktop-build.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-installers

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # nullglob keeps the unmatched glob from reaching gh as a literal path.
          shopt -s nullglob
          installers=(desktop-installers/*)
          flags=()
          if [ "${{ needs.plan.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ needs.plan.outputs.display_version }}" \
            --target main \
            --title "${{ needs.plan.outputs.display_version }}" \
            --generate-notes \
            "${flags[@]}" \
            "${installers[@]}"
