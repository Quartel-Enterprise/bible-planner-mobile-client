name: web

# The React web app (web/) over the shared JS library. Any Kotlin change can change the library or its
# TypeScript definitions, so the shared modules and the build count as well as web/ itself.
on:
  pull_request:
    # The defaults, plus a draft marked ready, which ai-review reviews then (see review-gate below).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/web.yml'
      - '.github/actions/gradle/action.yml'
      - 'web/**'
      - 'shared/**'
      - 'core/**'
      - 'feature/**'
      - 'ui/**'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'kotlin-js-store/**'
      - '!**/*.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web.yml'
      - '.github/actions/gradle/action.yml'
      - 'web/**'
      - 'shared/**'
      - 'core/**'
      - 'feature/**'
      - 'ui/**'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'kotlin-js-store/**'
      - '!**/*.md'

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one. On main every commit has a group
# of its own and always finishes, since the job writes main's Gradle cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Waits for the opening review on the commit a pull request opened with, or was marked ready for
  # review on, since that review may push a commit of its fixes, and on that fix commit; on all of
  # them, it holds the jobs below while a thread the review opened is unresolved. Every other event
  # skips it, and the jobs below run on a skipped gate too. See .github/workflows/review-gate.yml.
  review-gate:
    if: >-
      github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' && github.event.sender.login == 'claude[bot]')
    uses: ./.github/workflows/review-gate.yml
    permissions:
      actions: read
      pull-requests: read

  react:
    needs: review-gate
    if: ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # web/package.json depends on the library's folder (file:), so it has to exist before npm ci.
      - name: Build the shared JS library
        working-directory: .
        run: ./gradlew :shared:jsBrowserProductionLibraryDistribution

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build
