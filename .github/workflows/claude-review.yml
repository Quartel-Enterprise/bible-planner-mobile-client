name: claude-review

# Reviews every pull request with Claude when it opens, and posts the findings as inline comments.
# It is a second opinion on top of the review the create-pr skill already runs before the pull
# request opens. A draft is reviewed when it is marked ready for review instead. A reopened pull
# request isn't: Claude has commented on it already, so the review would skip it.
#
# The review only comments: the job fails only when the run itself does (an expired token, the
# timeout), never because of what it found. It runs once per pull request: the review skips a pull
# request it has already commented on. Adding the ai-review label reviews it again, after new pushes
# (claude-review-on-request).
on:
  pull_request:
    types:
      - opened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # GitHub withholds secrets from pull requests opened from forks, so the review can't run there.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/claude-review
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          memory-ssh-key: ${{ secrets.AGENT_MEMORY_DEPLOY_KEY }}
