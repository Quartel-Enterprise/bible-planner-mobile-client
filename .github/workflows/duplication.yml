name: duplication

# Runs on every pull request, with no paths filter: duplication is a required check of the main
# ruleset, and a check a paths filter skips never reports, which would hold the merge forever.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Why: no review-gate, unlike the other checks. A gate holding for open threads skips the jobs it guards, and a
  # skipped required check counts as passed, so a merge after the threads are resolved would skip this check.
  duplication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/jscpd/package-lock.json

      # The baseline of main, so a pull request that takes copied code in shows it as a warning.
      - name: Fetch the baseline of main
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:.jscpd-baseline.json > "$RUNNER_TEMP/jscpd-baseline-main.json" 2> /dev/null \
            || echo '{}' > "$RUNNER_TEMP/jscpd-baseline-main.json"

      # The same script as locally, with the jscpd release and dependencies scripts/jscpd locks.
      - name: Look for copied code
        run: ./scripts/cpd.sh --base "$RUNNER_TEMP/jscpd-baseline-main.json"
