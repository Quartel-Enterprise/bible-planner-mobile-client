name: cleanup-pr-caches

# The jobs on a pull request's critical path (build, the android shards and ios) write their own
# Gradle cache, scoped to refs/pull/<number>/merge. Those entries have two lives to end here:
#
# - While the pull request is open, every push saves a new transforms and build cache bundle per
#   writer job, hundreds of MB each, and the previous push's bundles serve nothing more: the next
#   run restores the newest entry of its job. Three pushes of one pull request held 12.5 GB of the
#   10 GB budget and pushed out the entries main had saved, so every new pull request started
#   cold. The prune job runs once both writer workflows of a push have succeeded and deletes what
#   that push's runs neither created nor restored, and what they restored and then replaced;
#   scripts/prune_pr_caches.sh has the rule.
# - Once the pull request is closed, nothing can read its entries at all, and the cleanup job
#   deletes them.
on:
  pull_request:
    types:
      - closed
  workflow_run:
    workflows:
      - build-and-test
      - ui-tests
    types:
      - completed

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  prune:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # Both writer workflows complete within minutes of each other, and the one to finish last does
    # the pruning: two runs for the same push would otherwise list and delete the same entries.
    concurrency:
      group: prune-pr-caches-${{ github.event.workflow_run.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # A writer job saves its cache in its post step, so the pruning waits until every writer
      # workflow of this push has completed, and only prunes after a green push: a job that failed
      # before it restored its cache would otherwise look like one that no longer exists, and lose
      # its entries. The run that completes last gets past this step. The time the push's runs
      # started is the line between the entries this push made or restored and the ones it left
      # behind. This step comes before the checkout, which the first of the two runs never needs.
      - name: Find the push's runs and pull requests
        id: push
        run: |
          runs=$(for workflow in build-and-test ui-tests; do
            gh run list --commit "$HEAD_SHA" --event pull_request --workflow "$workflow" --limit 10 \
              --json workflowName,status,conclusion,createdAt --jq '.[]'
          done | jq -s '.')
          if jq -e 'length < 2 or any(.status != "completed")' <<< "$runs" > /dev/null; then
            echo "A writer workflow of $HEAD_SHA is still running; its completion prunes."
            exit 0
          fi
          if jq -e 'any(.conclusion != "success")' <<< "$runs" > /dev/null; then
            echo "A writer workflow of $HEAD_SHA did not succeed; the next green push prunes."
            exit 0
          fi
          numbers=$(gh pr list --state open --search "$HEAD_SHA" --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" | tr '\n' ' ')
          if [ -z "$numbers" ]; then
            echo "No open pull request has $HEAD_SHA as its head: a newer push prunes, or the cleanup job does."
            exit 0
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
          echo "start=$(jq -r 'map(.createdAt) | min' <<< "$runs")" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.push.outputs.numbers != ''
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: scripts/prune_pr_caches.sh
          sparse-checkout-cone-mode: false

      # More than one open pull request can share a head commit (stacked branches); each has a
      # cache scope of its own.
      - name: Prune the entries this push no longer needs
        if: steps.push.outputs.numbers != ''
        env:
          NUMBERS: ${{ steps.push.outputs.numbers }}
          START: ${{ steps.push.outputs.start }}
        run: |
          for number in $NUMBERS; do
            ./scripts/prune_pr_caches.sh "refs/pull/$number/merge" "$START"
          done

  cleanup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A pull request merged while its checks are still running would otherwise save its caches
      # after this job has deleted them: entries that nothing can read any more. The push to
      # main runs the same checks on the merged code, so these results are no longer needed either.
      - name: Cancel the runs of this pull request
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pending_runs() {
            gh run list --commit "$HEAD_SHA" --event pull_request --limit 100 \
              --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' \
              | grep -vx "$GITHUB_RUN_ID" || true
          }
          pending_runs | xargs -r -n 1 gh run cancel || true
          # A cancelled job still runs its post steps, which is where the cache is saved
          for _ in $(seq 1 18); do
            [ -z "$(pending_runs)" ] && break
            sleep 10
          done

      # Every closed pull request and not only this one: a run that outlived the wait above leaves
      # its entries behind, and the next pull request to close picks them up here.
      - name: Delete the caches of closed pull requests
        run: |
          CACHES=$(gh cache list --limit 1000 --json id,ref \
            --jq '.[] | select((.ref // "") | test("^refs/pull/[0-9]+/merge$")) | "\(.id) \(.ref)"')
          NUMBERS=$(echo "$CACHES" | sed -nE 's#^[0-9]+ refs/pull/([0-9]+)/merge$#\1#p' | sort -u)
          for NUMBER in $NUMBERS; do
            if [ "$(gh pr view "$NUMBER" --json state --jq .state)" = "OPEN" ]; then
              continue
            fi
            echo "Deleting the caches of #$NUMBER"
            echo "$CACHES" | awk -v ref="refs/pull/$NUMBER/merge" '$2 == ref { print $1 }' \
              | xargs -r -n 1 gh cache delete || true
          done
