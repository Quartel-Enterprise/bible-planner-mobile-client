name: cleanup-pr-caches

# The jobs on a pull request's critical path (build, the android shards and ios) write their own
# Gradle cache, scoped to refs/pull/<number>/merge. Those entries have two lives to end here:
#
# - While the pull request is open, every push saves a new transforms and build cache bundle per
#   writer job, hundreds of MB each, and the previous push's bundles serve nothing more: the next
#   run restores the newest entry of its job. Three pushes of one pull request held 12.5 GB of the
#   10 GB budget and pushed out the entries main had saved, so every new pull request started
#   cold. The prune job runs once both writer workflows of a push have succeeded and deletes what
#   that push's runs neither created nor restored, and what they restored and then replaced;
#   scripts/prune_pr_caches.sh has the rule.
# - Once the pull request is closed, nothing can read its entries at all, and the cleanup job
#   deletes them.
on:
  pull_request:
    types:
      - closed
  workflow_run:
    workflows:
      - build-and-test
      - ui-tests
    types:
      - completed
    branches-ignore:
      - main

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  prune:
    # A failed or cancelled run never gets past the gate below, so it starts no runner. A run from
    # a fork lists no pull request, and a fork's jobs write no cache.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      join(github.event.workflow_run.pull_requests.*.number) != ''
    runs-on: ubuntu-latest
    # Both writer workflows complete within minutes of each other. The gate lets through whichever
    # completes last and, when they complete together, both: the group then runs them one after
    # the other, and the second finds nothing left to delete.
    concurrency:
      group: prune-pr-caches-${{ github.event.workflow_run.pull_requests[0].number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      # A writer job saves its cache in its post step, so the pruning waits until the latest run of
      # each writer workflow for this push of this pull request has completed, and only prunes
      # after a green push: a job that failed before it restored its cache would otherwise look
      # like one that no longer exists, and lose its entries. Both workflows ignore the same paths,
      # so a push runs both or neither; a push with a run of only one is not pruned, since the
      # other's jobs restored nothing and their entries would look unused. Older runs of the same
      # commit (cancelled on close, say, and reopened) and the runs of another pull request with the
      # same head are ignored, and so is a push that is no longer the pull request's head: a newer
      # push is restoring and saving, and its own completion prunes. The time the push's runs
      # started is the line between the entries this push made or restored and the ones it left
      # behind. This step comes before the checkout, which a run that stops here never needs. A
      # failing gh call fails the step, so a broken gate shows as a red check instead of a silent
      # skip. The run that triggered this one is complete and successful whatever the listing says
      # of it, which can lag behind the event by a few seconds.
      - name: Find the push's runs
        id: push
        run: |
          head=$(gh pr view "$NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "#$NUMBER has moved on from $HEAD_SHA to $head; the newer push prunes."
            exit 0
          fi
          verdict=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
            --jq "[.workflow_runs[] | select(.pull_requests | any(.number == $NUMBER))
                   | if .id == $RUN_ID then .status = \"completed\" | .conclusion = \"success\" else . end]
                   | [\"build-and-test\", \"ui-tests\"] as \$writers
                   | map(select(.name | IN(\$writers[]))) | group_by(.name) | map(max_by(.created_at))
                   | if length < (\$writers | length) then \"only one writer workflow ran; nothing to prune for this push\"
                     elif any(.status != \"completed\") then \"a writer workflow has not completed; its completion prunes\"
                     elif any(.conclusion != \"success\") then \"a writer workflow did not succeed; the next green push prunes\"
                     else \"start=\" + (map(.created_at) | min) end")
          case "$verdict" in
            start=*) echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *) echo "#$NUMBER at $HEAD_SHA: $verdict." ;;
          esac

      - name: Checkout code
        if: steps.push.outputs.start != ''
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: scripts/prune_pr_caches.sh
          sparse-checkout-cone-mode: false

      - name: Prune the entries this push no longer needs
        if: steps.push.outputs.start != ''
        run: ./scripts/prune_pr_caches.sh "refs/pull/$NUMBER/merge" "${{ steps.push.outputs.start }}"

  cleanup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A pull request merged while its checks are still running would otherwise save its caches
      # after this job has deleted them: entries that nothing can read any more. The push to
      # main runs the same checks on the merged code, so these results are no longer needed either.
      - name: Cancel the runs of this pull request
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pending_runs() {
            gh run list --commit "$HEAD_SHA" --event pull_request --limit 100 \
              --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' \
              | grep -vx "$GITHUB_RUN_ID" || true
          }
          pending_runs | xargs -r -n 1 gh run cancel || true
          # A cancelled job still runs its post steps, which is where the cache is saved
          for _ in $(seq 1 18); do
            [ -z "$(pending_runs)" ] && break
            sleep 10
          done

      # Every closed pull request and not only this one: a run that outlived the wait above leaves
      # its entries behind, and the next pull request to close picks them up here.
      - name: Delete the caches of closed pull requests
        run: |
          CACHES=$(gh cache list --limit 1000 --json id,ref \
            --jq '.[] | select((.ref // "") | test("^refs/pull/[0-9]+/merge$")) | "\(.id) \(.ref)"')
          NUMBERS=$(echo "$CACHES" | sed -nE 's#^[0-9]+ refs/pull/([0-9]+)/merge$#\1#p' | sort -u)
          for NUMBER in $NUMBERS; do
            if [ "$(gh pr view "$NUMBER" --json state --jq .state)" = "OPEN" ]; then
              continue
            fi
            echo "Deleting the caches of #$NUMBER"
            echo "$CACHES" | awk -v ref="refs/pull/$NUMBER/merge" '$2 == ref { print $1 }' \
              | xargs -r -n 1 gh cache delete || true
          done
