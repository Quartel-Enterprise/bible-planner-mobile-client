name: run-checks

# Re-runs the checks review-gate held on a pull request's head commit for claude-review's open
# threads (see review-gate.yml), once those threads are resolved. Resolving a thread starts no
# workflow, so adding the run-checks label is what starts them when the author resolved the threads
# without pushing. A push needs no label: it runs the checks on its own commit, and merge-when-green
# re-runs them on its own once every thread is resolved.
#
# With a thread still open, nothing is re-run, since the gate would only hold the checks again: a
# comment says so. The label goes either way, so it can be added again.
on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read

jobs:
  rerun:
    if: github.event.label.name == 'run-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/review_gate.sh
          sparse-checkout-cone-mode: false

      - name: Re-run the held checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          remove_label() {
            gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/run-checks" > /dev/null || true
          }
          trap remove_label EXIT

          open=$(./scripts/review_gate.sh open-threads "$PR_NUMBER" --claude)
          if [ "$open" -gt 0 ]; then
            body="$open thread(s) of the Claude review are still unresolved, so the held checks weren't"
            body+=" re-run. Fix each one, or reply with why it stays as it is, resolve them, then add the"
            body+=" \`run-checks\` label again."
            gh pr comment "$PR_NUMBER" --body "$body"
            exit 0
          fi

          rerun=$(./scripts/review_gate.sh rerun-held "$HEAD_SHA")
          if [ "$rerun" -eq 0 ]; then
            echo "::notice::No check of $HEAD_SHA was held, so nothing was re-run."
          else
            echo "Re-ran $rerun held run(s) of $HEAD_SHA."
          fi
