name: review-gate

# Called by the pull request workflows that build and test the app, as their first job: on the
# commit a pull request opened with, or a draft was marked ready for review on, and on claude-review's
# own fix commit, it waits for that review to end, and holds the checks while a thread it opened is
# unresolved. The waiting and the counting are the gate action of Quartel-Enterprise/claude-review
# (see its README and docs/ci.md, "Fixes and the review gate"); this job only fails the hold, in a
# step whose name run-checks and merge-when-green look for to re-run the held runs.
#
# The callers run it only on those events: every other one (an author's push, a reopened pull
# request, a push to main) skips it, and their jobs run on a skipped gate, so it starts no runner
# there.
on:
  workflow_call:
    outputs:
      proceed:
        description: "'false' when the checks run on a newer head instead, or are held for the review's open threads."
        value: ${{ jobs.wait.outputs.proceed }}

jobs:
  wait:
    name: wait for review
    runs-on: ubuntu-latest
    # Over the gate's wait-minutes.
    timeout-minutes: 45
    permissions:
      actions: read
      pull-requests: read
    # A hold fails the job after its outputs are set, so the callers still read proceed.
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        uses: Quartel-Enterprise/claude-review/gate@1.1.0
        with:
          # Under timeout-minutes, so a review stuck in the queue still lets the checks run.
          wait-minutes: 40

      # The step's name is what the threads action's rerun-held looks for.
      - name: Hold for the open threads
        if: steps.gate.outputs.open-threads != ''
        env:
          OPEN_THREADS: ${{ steps.gate.outputs.open-threads }}
        run: |
          echo "::error::claude-review left $OPEN_THREADS open thread(s), so this workflow's checks didn't run. Push their fixes, which runs the checks on the new commit, or resolve them and add the run-checks label."
          exit 1
