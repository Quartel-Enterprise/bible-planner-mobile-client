name: translations

on:
  pull_request:
    paths:
      - '.github/workflows/translations.yml'
      - 'scripts/check_translations.py'
      - '**/strings.xml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/translations.yml'
      - 'scripts/check_translations.py'
      - '**/strings.xml'

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # python3 ships with the runner image and the script has no dependencies,
      # so there is nothing to set up or cache here
      - name: Check translations
        run: python3 scripts/check_translations.py
